<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Proc 设置</title>
	<style>
		:root {
			color-scheme: light dark;
			font-family: ui-sans-serif, system-ui, sans-serif;
			line-height: 1.5;
			--border: color-mix(in srgb, CanvasText 22%, transparent);
			--border-focus: color-mix(in srgb, CanvasText 55%, transparent);
		}
		body {
			max-width: 32rem;
			margin: 2rem auto;
			padding: 0 1rem 3rem;
		}
		h1 {
			font-size: 1.25rem;
			font-weight: 600;
			margin: 0 0 1.5rem;
		}
		section {
			margin-bottom: 2rem;
		}
		h2 {
			font-size: 1rem;
			font-weight: 600;
			margin: 0 0 .35rem;
		}
		.hint {
			color: color-mix(in srgb, CanvasText 65%, transparent);
			margin: 0 0 1rem;
			font-size: .9rem;
		}
		.field-hint {
			color: color-mix(in srgb, CanvasText 65%, transparent);
			font-size: .85rem;
		}
		label {
			display: grid;
			gap: .35rem;
			margin-bottom: 1rem;
			font-size: .9rem;
		}
		.filters {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.filters label {
			margin-bottom: 0;
		}
		input, select {
			padding: .5rem .65rem;
			border: 1px solid var(--border);
			border-radius: .4rem;
			background: Canvas;
			color: CanvasText;
			font: inherit;
			outline: none;
		}
		input:focus, select:focus {
			border-color: var(--border-focus);
			box-shadow: 0 0 0 1px var(--border-focus);
		}
		.actions {
			display: flex;
			gap: .5rem;
			flex-wrap: wrap;
		}
		button {
			padding: .5rem 1rem;
			border: 0;
			border-radius: .4rem;
			background: CanvasText;
			color: Canvas;
			font: inherit;
			cursor: pointer;
		}
		button.secondary {
			background: transparent;
			color: CanvasText;
			border: 1px solid var(--border);
		}
		.status {
			margin-top: 1rem;
			font-size: .9rem;
			min-height: 1.5em;
		}
	</style>
</head>
<body>
	<h1>Proc 设置</h1>

	<section>
		<h2>edge-tts-server</h2>
		<p class="hint">
			自行部署
			<a href="https://github.com/AAA-voc-pifa/edge-tts-server" target="_blank" rel="noreferrer">edge-tts-server</a>
			后填写，用于读例句。
		</p>
		<label>
			API URL 前缀
			<input id="tts_url_prefix" type="url" placeholder="https://your-edge-tts.example.com" autocomplete="off" />
		</label>
		<label>
			Password
			<input id="tts_password" type="password" autocomplete="off" />
		</label>
		<div class="filters">
			<label>
				Locale
				<select id="filter_locale">
					<option value="">全部</option>
				</select>
			</label>
			<label>
				性别
				<select id="filter_gender">
					<option value="">全部</option>
					<option value="Female">女</option>
					<option value="Male">男</option>
				</select>
			</label>
		</div>
		<label>
			Voice
			<select id="voice">
				<option value="">填写上方配置后自动加载</option>
			</select>
		</label>
		<label>
			Rate
			<input id="tts_rate" type="text" value="-20%" placeholder="-20%" autocomplete="off" />
			<span class="field-hint">格式如 +0%、-20%。点「例句」或按 e 用 +0%；Shift+E 用此处语速。</span>
		</label>
		<div class="actions">
			<button id="tts_save" type="button">保存</button>
			<button id="tts_clear" class="secondary" type="button">清空设置</button>
		</div>
		<p id="tts_status" class="status"></p>
	</section>

	<section>
		<h2>voc-api</h2>
		<p class="hint">
			自行部署
			<a href="https://github.com/AAA-voc-pifa/voc-api" target="_blank" rel="noreferrer">voc-api</a>
			后填写，用于单词本。
		</p>
		<label>
			API URL 前缀
			<input id="voc_url_prefix" type="url" placeholder="https://your-voc-api.example.com" autocomplete="off" />
		</label>
		<label>
			Authentication
			<input id="voc_authentication" type="password" autocomplete="off" />
		</label>
		<div class="actions">
			<button id="voc_save" type="button">保存</button>
			<button id="voc_clear" class="secondary" type="button">清空设置</button>
		</div>
		<p id="voc_status" class="status"></p>
	</section>

	<script src="options.js"></script>
</body>
</html>
